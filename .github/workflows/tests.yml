name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: composer
      - run: composer validate --strict
      - run: php tests/run.php
